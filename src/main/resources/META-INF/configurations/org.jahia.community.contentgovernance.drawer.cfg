# default configuration - won't be overridden
# Content Governance - what the drawer shows to every editor of the server
#
# Deployed to: digital-factory-data/karaf/etc/org.jahia.community.contentgovernance.drawer.cfg
# Edit it there at runtime. Editors see a change the next time they open the drawer.
# The first line above stops Jahia overwriting your edits when the module is redeployed.
# Each element stays hidden unless its key is true.

# The "Fix first" list under the tab bar of the drawer: the critical and serious
# findings of every tab, each with a link to its tab.
SHOW_FIX_FIRST=false

# The "Show preview" button of Page quality, which shows or hides the preview of
# the page. Hidden, the preview keeps its own behaviour: it stays hidden beside
# Page Builder, shows elsewhere, and opens to show an item located in it.
SHOW_PREVIEW_BUTTON=false

# The "Page summary" at the top of Jahia health: the publication status of the
# page, the number of content items analyzed and the site languages checked.
SHOW_PAGE_SUMMARY=false
