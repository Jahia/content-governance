# default configuration - won't be overridden
# Content Governance - the AI features
#
# Deployed to: digital-factory-data/karaf/etc/org.jahia.community.contentgovernance.llm.cfg
# Edit it there at runtime. Changes apply immediately, no redeploy needed.
# The first line above stops Jahia overwriting your edits when the module is redeployed.
#
# The AI features are the AI review tab of Page quality, the SEO, alt text and
# plain-language assists, and the written report of the GEO dashboard.
# genai-connector serves their model: it holds the provider, the key and the
# model of each tier, in its own configuration (org.jahia.modules.genai.cfg).
# Every feature asks for the balanced tier. The alt text assist asks for the
# vision tier when it sends pictures, or when only that tier has a model.
# Without genai-connector, or for a user who lacks the genaiAccess
# permission on the site, the features are shown greyed out and nothing
# leaves the server.
#
# AI_PROVIDER, AI_MODEL, AI_API_KEY, AI_BASE_URL, AI_MAX_TOKENS,
# AI_REPORT_MAX_TOKENS and AI_COST_*_PER_MTOKENS are no longer read. Remove them
# from this file on the server, the key first.
#
# What is sent to the model: the page text, its metadata and a digest of the
# automated findings (page tasks); a digest of the site measurements (GEO
# report: scores, failing check ids, page paths and titles, counts). Pictures
# only for the alt text assist, and only when genai-connector serves the
# vision tier.

# Calls allowed per user per ten minutes. Each one is paid for.
AI_RATE_MAX_CALLS=30
AI_REPORT_RATE_MAX_CALLS=5

# Optional. Instructions appended to every prompt: brand, tone, editorial rules.
#   AI_PROMPT_APPENDIX=Tone of voice is formal French ("vous"). Product names are never translated.
AI_PROMPT_APPENDIX=
