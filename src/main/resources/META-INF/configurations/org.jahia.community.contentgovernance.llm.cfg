# default configuration - won't be overridden
# Content Governance - the model shared by every AI feature
#
# Deployed to: digital-factory-data/karaf/etc/org.jahia.community.contentgovernance.llm.cfg
# Edit it there at runtime. Changes apply immediately, no redeploy needed.
# The first line above stops Jahia overwriting your edits when the module is redeployed.
# Never commit an API key to source control.
#
# One connection for: the AI review tab of Page quality, the SEO, alt text and
# plain-language assists, and the written report of the GEO dashboard.
# Until AI_PROVIDER, AI_MODEL and AI_API_KEY are all set, these features are
# shown greyed out and nothing leaves the server. The key is only used
# server-side; it is never sent to the browser.
#
# What is sent to the provider: the page text, its metadata and a digest of the
# automated findings (page tasks); a digest of the site measurements (GEO
# report: scores, failing check ids, page paths and titles, counts). Pictures
# only for the alt text assist, and only with a provider that reads images.

# anthropic | openai | deepseek
AI_PROVIDER=
# The model id of that provider.
AI_MODEL=
AI_API_KEY=
# Optional. The provider's API base, for a proxy or a compatible gateway.
AI_BASE_URL=

# Output budget of a page review or assist. A full review needs 3000-4000 tokens;
# too low and the answer is cut (complete items are kept and flagged truncated).
AI_MAX_TOKENS=4096
# Output budget of a GEO site report, a longer answer.
AI_REPORT_MAX_TOKENS=6000

# Calls allowed per user per ten minutes. Each one is paid for.
AI_RATE_MAX_CALLS=30
AI_REPORT_RATE_MAX_CALLS=5

# Optional. Price of the model in USD per million tokens, to show editors the
# cost of each page review. Left empty, no cost is shown.
AI_COST_INPUT_PER_MTOKENS=
AI_COST_OUTPUT_PER_MTOKENS=

# Optional. Instructions appended to every prompt: brand, tone, editorial rules.
#   AI_PROMPT_APPENDIX=Tone of voice is formal French ("vous"). Product names are never translated.
AI_PROMPT_APPENDIX=
