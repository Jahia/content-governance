# CSRF guard whitelist for the POST endpoints of the editorial frame.
# Each endpoint protects itself: it accepts an authenticated user who is not a guest, and it
# requires a content type that a cross-site form cannot send without a CORS preflight:
# application/zip for the import, application/json for the voice and the setup. The import and
# the setup also require the permission siteAdministrationAccess on the site, and the voice writes
# the node of the current user only.
#
# Each entry names one endpoint, after an optional context path. jahia-csrf-guard reads an entry
# as a regular expression that must match the whole path, so these entries use no '*'.
whitelist = (/[^/]+)?/modules/editorial-frame/import, (/[^/]+)?/modules/editorial-frame/voice, (/[^/]+)?/modules/editorial-frame/setup
