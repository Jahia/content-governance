ccsmix_complianceContent=Conformit\u00e9

ccs_glossary=Glossaire de conformit\u00e9
ccs_glossary.ui.tooltip=Liste des termes qui ne doivent pas \u00eatre employ\u00e9s dans le contenu d'une langue de ce site. La section Conformit\u00e9 du panneau Gouvernance des contenus signale chaque occurrence.
ccs_glossary.language=Langue
ccs_glossary.language.ui.tooltip=Langue des contenus auxquels ce glossaire s'applique. Cr\u00e9ez un glossaire par langue, ou plusieurs pour la m\u00eame langue : le contr\u00f4le les applique tous.
ccs_glossary.description=Description
ccs_glossary.description.ui.tooltip=Ce que couvre ce glossaire et qui le tient \u00e0 jour (par exemple : service juridique, termes du droit de la consommation). Jamais affich\u00e9 aux visiteurs.

ccs_glossaryTerm=Terme non autoris\u00e9
ccs_glossaryTerm.ui.tooltip=Un mot ou une expression \u00e0 ne pas employer dans cette langue.
ccs_glossaryTerm.term=Terme
ccs_glossaryTerm.term.ui.tooltip=Le mot ou l'expression \u00e0 signaler. La casse et les accents sont ignor\u00e9s : \u00ab gratuit\u00e9 \u00bb trouve aussi \u00ab Gratuite \u00bb et \u00ab GRATUIT\u00c9 \u00bb.
ccs_glossaryTerm.matchMode=Correspondance
ccs_glossaryTerm.matchMode.ui.tooltip=Mot entier : le mot ou l'expression seuls. Mot commen\u00e7ant par : aussi les mots qui commencent ainsi (garant trouve garantie, garanti). Partout : aussi \u00e0 l'int\u00e9rieur d'autres mots.
ccs_glossaryTerm.matchMode.word=Mot ou expression entiers
ccs_glossaryTerm.matchMode.prefix=Mot commen\u00e7ant par
ccs_glossaryTerm.matchMode.anywhere=Partout, y compris dans les mots
ccs_glossaryTerm.reason=Motif
ccs_glossaryTerm.reason.ui.tooltip=Pourquoi ce terme ne doit pas \u00eatre employ\u00e9. Affich\u00e9 au contributeur dans le rapport du contr\u00f4le.
ccs_glossaryTerm.alternative=Formulation conseill\u00e9e
ccs_glossaryTerm.alternative.ui.tooltip=Ce qu'il faut \u00e9crire \u00e0 la place. Affich\u00e9 au contributeur dans le rapport du contr\u00f4le.

# Le glossaire d'exemple cr\u00e9\u00e9 quand le module est activ\u00e9 sur un site (GlossarySeeder) : du contenu, dans la langue par d\u00e9faut du site
seed.folder=Glossaires de conformit\u00e9
seed.glossary=Termes non autoris\u00e9s
seed.glossary.description=Exemple cr\u00e9\u00e9 \u00e0 l'activation de Content Governance sur ce site. Ajoutez les termes que ce site ne doit pas employer, et supprimez le terme d'exemple une fois les v\u00f4tres saisis.
seed.term=cliquez ici
seed.term.reason=Un lien doit dire o\u00f9 il m\u00e8ne : les utilisateurs de lecteurs d'\u00e9cran parcourent souvent les liens d'une page hors de leur contexte.
seed.term.alternative=nommez la destination, par exemple \u00ab Lire le rapport annuel 2026 \u00bb
