ccsmix_complianceContent=Conformité

ccs_glossary=Glossaire de conformité
ccs_glossary.ui.tooltip=Liste des termes qui ne doivent pas être employés dans le contenu d'une langue de ce site. Le contrôle de conformité de Page Builder signale chaque occurrence.
ccs_glossary.language=Langue
ccs_glossary.language.ui.tooltip=Langue des contenus auxquels ce glossaire s'applique. Créez un glossaire par langue, ou plusieurs pour la même langue : le contrôle les applique tous.
ccs_glossary.description=Description
ccs_glossary.description.ui.tooltip=Ce que couvre ce glossaire et qui le tient à jour (par exemple : service juridique, termes du droit de la consommation). Jamais affiché aux visiteurs.

ccs_glossaryTerm=Terme non autorisé
ccs_glossaryTerm.ui.tooltip=Un mot ou une expression à ne pas employer dans cette langue.
ccs_glossaryTerm.term=Terme
ccs_glossaryTerm.term.ui.tooltip=Le mot ou l'expression à signaler. La casse et les accents sont ignorés : « gratuité » trouve aussi « Gratuite » et « GRATUITÉ ».
ccs_glossaryTerm.matchMode=Correspondance
ccs_glossaryTerm.matchMode.ui.tooltip=Mot entier : le mot ou l'expression seuls. Mot commençant par : aussi les mots qui commencent ainsi (garant trouve garantie, garanti). Partout : aussi à l'intérieur d'autres mots.
ccs_glossaryTerm.matchMode.word=Mot ou expression entiers
ccs_glossaryTerm.matchMode.prefix=Mot commençant par
ccs_glossaryTerm.matchMode.anywhere=Partout, y compris dans les mots
ccs_glossaryTerm.reason=Motif
ccs_glossaryTerm.reason.ui.tooltip=Pourquoi ce terme ne doit pas être employé. Affiché au contributeur dans le rapport du contrôle.
ccs_glossaryTerm.alternative=Formulation conseillée
ccs_glossaryTerm.alternative.ui.tooltip=Ce qu'il faut écrire à la place. Affiché au contributeur dans le rapport du contrôle.
