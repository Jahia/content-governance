ccsmix_complianceContent=Conformit\u00e9

ccs_glossary=Glossaire de conformit\u00e9
ccs_glossary.ui.tooltip=Liste des termes qui ne doivent pas \u00eatre employ\u00e9s dans le contenu d'une langue de ce site. La section Conformit\u00e9 du panneau Gouvernance des contenus signale chaque occurrence.
ccs_glossary.language=Langue
ccs_glossary.language.ui.tooltip=Langue des contenus auxquels ce glossaire s'applique. Cr\u00e9ez un glossaire par langue, ou plusieurs pour la m\u00eame langue : le contr\u00f4le les applique tous.
ccs_glossary.description=Description
ccs_glossary.description.ui.tooltip=Ce que couvre ce glossaire et qui le tient \u00e0 jour (par exemple : service juridique, termes du droit de la consommation). Jamais affich\u00e9 aux visiteurs.

ccs_glossaryTerm=Terme non autoris\u00e9
ccs_glossaryTerm.ui.tooltip=Un mot ou une expression \u00e0 ne pas employer dans cette langue.
ccs_glossaryTerm.term=Terme
ccs_glossaryTerm.term.ui.tooltip=Le mot ou l'expression \u00e0 signaler. La casse et les accents sont ignor\u00e9s : \u00ab gratuit\u00e9 \u00bb trouve aussi \u00ab Gratuite \u00bb et \u00ab GRATUIT\u00c9 \u00bb.
ccs_glossaryTerm.matchMode=Correspondance
ccs_glossaryTerm.matchMode.ui.tooltip=Mot entier : le mot ou l'expression seuls. Mot commen\u00e7ant par : aussi les mots qui commencent ainsi (garant trouve garantie, garanti). Partout : aussi \u00e0 l'int\u00e9rieur d'autres mots.
ccs_glossaryTerm.matchMode.word=Mot ou expression entiers
ccs_glossaryTerm.matchMode.prefix=Mot commen\u00e7ant par
ccs_glossaryTerm.matchMode.anywhere=Partout, y compris dans les mots
ccs_glossaryTerm.reason=Motif
ccs_glossaryTerm.reason.ui.tooltip=Pourquoi ce terme ne doit pas \u00eatre employ\u00e9. Affich\u00e9 au contributeur dans le rapport du contr\u00f4le.
ccs_glossaryTerm.alternative=Formulation conseill\u00e9e
ccs_glossaryTerm.alternative.ui.tooltip=Ce qu'il faut \u00e9crire \u00e0 la place. Affich\u00e9 au contributeur dans le rapport du contr\u00f4le.

# Le glossaire d'exemple cr\u00e9\u00e9 quand le module est activ\u00e9 sur un site (GlossarySeeder) : du contenu, dans la langue par d\u00e9faut du site
seed.folder=Glossaires de conformit\u00e9
seed.glossary=Termes non autoris\u00e9s
seed.glossary.description=Exemple cr\u00e9\u00e9 \u00e0 l'activation de Content Governance sur ce site. Ajoutez les termes que ce site ne doit pas employer, et supprimez le terme d'exemple une fois les v\u00f4tres saisis.
seed.term=cliquez ici
seed.term.reason=Un lien doit dire o\u00f9 il m\u00e8ne : les utilisateurs de lecteurs d'\u00e9cran parcourent souvent les liens d'une page hors de leur contexte.
seed.term.alternative=nommez la destination, par exemple \u00ab Lire le rapport annuel 2026 \u00bb

ccs_contentRule=R\u00e8gle de contenu
ccs_contentRule.ui.tooltip=Une r\u00e8gle que les contr\u00f4les de Content governance appliquent. Un module ajoute ses r\u00e8gles \u00e0 l'arbre du site syst\u00e8me, o\u00f9 un administrateur les modifie pour tous les sites. Un site ajoute une r\u00e8gle qui lui est propre.
ccs_contentRule.ruleId=R\u00e8gle
ccs_contentRule.ruleId.ui.tooltip=L'identifiant de la r\u00e8gle, comme acme.price, que chaque constat de la r\u00e8gle affiche. Une seule r\u00e8gle du site le porte.
ccs_contentRule.checkType=Type de contr\u00f4le
ccs_contentRule.checkType.ui.tooltip=Le type de contr\u00f4le, qui choisit les champs de la r\u00e8gle. Motif : une r\u00e8gle d'\u00e9criture, sans mod\u00e8le. IA : un mod\u00e8le contr\u00f4le le conseil. Code : une mesure ou un constat du code, avec ses limites.
ccs_contentRule.checkType.PATTERN=Motif
ccs_contentRule.checkType.AI=IA
ccs_contentRule.checkType.CODE=Code
ccs_contentRule.evaluator=Contr\u00f4le
ccs_contentRule.evaluator.ui.tooltip=Ce qui contr\u00f4le la r\u00e8gle : pattern, threshold, presence, model, ou l'identifiant d'un contr\u00f4le qu'un module enregistre.
ccs_contentRule.subdomain=Sous-domaine
ccs_contentRule.subdomain.ui.tooltip=L'identifiant du sous-domaine d'une r\u00e8gle hors de l'arbre, comme writing : ses constats s'affichent dans celui-ci. Vide : le sous-domaine du d\u00e9but de l'identifiant, sinon terms pour un terme. Une r\u00e8gle de l'arbre prend le sous-domaine de son parent.
ccs_contentRule.sites=Sites
ccs_contentRule.sites.ui.tooltip=Les sites o\u00f9 la r\u00e8gle est active par d\u00e9faut. Tous les sites par d\u00e9faut. La disposition d'un site l'emporte.
ccs_contentRule.enabled=Active
ccs_contentRule.enabled.ui.tooltip=D\u00e9cochez pour d\u00e9sactiver la r\u00e8gle : les contr\u00f4les ne signalent alors plus rien pour elle. Sur une r\u00e8gle du site syst\u00e8me, le choix vaut pour chaque site dont la disposition ne place pas la r\u00e8gle.
ccs_contentRule.severity=Gravit\u00e9
ccs_contentRule.severity.critical=Critique
ccs_contentRule.severity.serious=S\u00e9rieuse
ccs_contentRule.severity.moderate=Mod\u00e9r\u00e9e
ccs_contentRule.severity.minor=Mineure
ccs_contentRule.blocking=Bloquante
ccs_contentRule.blocking.ui.tooltip=Un constat d'une r\u00e8gle bloquante arr\u00eate la publication du contenu.
ccs_contentRule.fixer=Corrig\u00e9e par
ccs_contentRule.fixer.editor=R\u00e9dacteur
ccs_contentRule.fixer.developer=D\u00e9veloppeur
ccs_contentRule.fixer.administrator=Administrateur
ccs_contentRule.runtime=S'ex\u00e9cute dans
ccs_contentRule.runtime.ui.tooltip=O\u00f9 s'ex\u00e9cute le contr\u00f4le de la r\u00e8gle. Navigateur : le panneau Gouvernance des contenus l'ex\u00e9cute sur l'aper\u00e7u de la page, et il n'emp\u00eache jamais une publication. Vide : le serveur.
ccs_contentRule.runtime.server=Serveur
ccs_contentRule.runtime.browser=Navigateur
ccs_contentRule.advice=Conseil
ccs_contentRule.advice.ui.tooltip=Ce qu'il faut faire d'un constat, que le r\u00e9dacteur lit. Pour une r\u00e8gle du type de contr\u00f4le IA, le crit\u00e8re que le mod\u00e8le contr\u00f4le.
ccs_contentRule.title=Titre du constat
ccs_contentRule.title.ui.tooltip=Le titre d'un constat, une ligne par forme du pluriel, comme "one: {{count}} image sans alternative textuelle". Valeurs : {{count}}, {{value}}, {{min}}, {{max}}.
ccs_contentRule.label=Libell\u00e9
ccs_contentRule.label.ui.tooltip=Un nom neutre de ce que la r\u00e8gle contr\u00f4le, comme "Longueur du titre", dans une liste de r\u00e8gles r\u00e9ussies et \u00e9chou\u00e9es.
ccs_contentRule.source=Import\u00e9e de
ccs_contentRule.retired=N'est plus livr\u00e9e
ccs_contentRule.retired.ui.tooltip=Pos\u00e9 quand le module de la r\u00e8gle ne la livre plus. Un administrateur a modifi\u00e9 la r\u00e8gle, donc la r\u00e8gle reste.
ccsmix_patternCheck=Contr\u00f4le par motif
ccsmix_patternCheck.kind=Type
ccsmix_patternCheck.kind.forbidden=Terme interdit
ccsmix_patternCheck.kind.replace=Terme \u00e0 remplacer
ccsmix_patternCheck.kind.mandatory=Mention obligatoire
ccsmix_patternCheck.kind.style=Motif de style
ccsmix_patternCheck.pattern=Terme ou motif
ccsmix_patternCheck.matchMode=Correspondance
ccsmix_patternCheck.matchMode.term=Mot ou expression enti\u00e8re, sans casse ni accents
ccsmix_patternCheck.matchMode.regex=Expression r\u00e9guli\u00e8re
ccsmix_patternCheck.matchMode.ui.tooltip=Une expression r\u00e9guli\u00e8re ignore la casse, comme un terme. Commencez-la par (?-i) pour respecter la casse.
ccsmix_patternCheck.replacement=Remplacement
ccsmix_patternCheck.ruleLanguage=Langue (vide : toutes)
ccsmix_patternCheck.patternForms=Autres formes du terme
ccsmix_patternCheck.replacementForms=Autres formes du remplacement
ccsmix_patternCheck.patternLanguage=Langue du terme (glossaire)
ccsmix_patternCheck.wrongExamples=Mauvais exemples (textes qui enfreignent la r\u00e8gle)
ccsmix_patternCheck.rightExamples=Bons exemples (textes qui respectent la r\u00e8gle)
ccsmix_patternCheck.owner=Responsable
ccsmix_patternCheck.decidedOn=D\u00e9cid\u00e9e le
ccsmix_patternCheck.validFrom=S'applique \u00e0 partir du (vide : sans d\u00e9but)
ccsmix_patternCheck.validUntil=S'applique jusqu'au, ce jour inclus (vide : sans fin)
ccsmix_aiCheck=Contr\u00f4le par IA
ccsmix_aiCheck.minimum=Score minimal
ccsmix_aiCheck.minimum.ui.tooltip=Le plus petit score du mod\u00e8le accept\u00e9, de 0 \u00e0 100. Vide : le score minimal du contr\u00f4le.
ccsmix_codeCheck=Contr\u00f4le par code
ccsmix_codeCheck.unit=Unit\u00e9
ccsmix_codeCheck.unit.ui.tooltip=L'unit\u00e9 du minimum et du maximum, comme characters.
ccsmix_codeCheck.minimum=Minimum
ccsmix_codeCheck.minimum.ui.tooltip=La plus petite valeur accept\u00e9e, pour le contr\u00f4le threshold.
ccsmix_codeCheck.maximum=Maximum
ccsmix_codeCheck.maximum.ui.tooltip=La plus grande valeur accept\u00e9e, pour le contr\u00f4le threshold.
ccs_contentRuleFolder=R\u00e8gles de contenu
ccs_contentRuleFolder.ui.tooltip=Les copies des r\u00e8gles d'un module, avant la version 2.0.0. Le module les supprime \u00e0 son d\u00e9marrage.
