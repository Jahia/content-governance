ccsmix_complianceContent=Compliance

ccs_glossary=Compliance-Glossar
ccs_glossary.ui.tooltip=Liste der Begriffe, die im Inhalt einer Sprache dieser Website nicht verwendet werden d\u00fcrfen. Der Bereich Compliance des Content-Governance-Panels meldet jede Verwendung.
ccs_glossary.language=Sprache
ccs_glossary.language.ui.tooltip=Sprache der Inhalte, f\u00fcr die dieses Glossar gilt. Legen Sie ein Glossar pro Sprache an oder mehrere f\u00fcr dieselbe Sprache: Der Scan wendet sie alle an.
ccs_glossary.description=Beschreibung
ccs_glossary.description.ui.tooltip=Was dieses Glossar abdeckt und wer es pflegt (zum Beispiel: Rechtsabteilung, Verbraucherrecht). Wird Besuchern nicht angezeigt.

ccs_glossaryTerm=Unzul\u00e4ssiger Begriff
ccs_glossaryTerm.ui.tooltip=Ein Wort oder eine Wendung, die in dieser Sprache nicht verwendet werden darf.
ccs_glossaryTerm.term=Begriff
ccs_glossaryTerm.term.ui.tooltip=Das zu meldende Wort oder die Wendung. Gro\u00df- und Kleinschreibung sowie Akzente werden ignoriert: \u201egratuit\u00e9\u201c findet auch \u201eGratuite\u201c und \u201eGRATUIT\u00c9\u201c.
ccs_glossaryTerm.matchMode=Treffer
ccs_glossaryTerm.matchMode.ui.tooltip=Ganzes Wort: nur das Wort oder die Wendung selbst. Wortanfang: auch W\u00f6rter, die damit beginnen (garant findet garantiert, Garantie). \u00dcberall: auch innerhalb anderer W\u00f6rter.
ccs_glossaryTerm.matchMode.word=Ganzes Wort oder ganze Wendung
ccs_glossaryTerm.matchMode.prefix=Wort beginnt mit
ccs_glossaryTerm.matchMode.anywhere=\u00dcberall, auch innerhalb von W\u00f6rtern
ccs_glossaryTerm.reason=Grund
ccs_glossaryTerm.reason.ui.tooltip=Warum dieser Begriff nicht verwendet werden darf. Wird dem Redakteur im Scanbericht angezeigt.
ccs_glossaryTerm.alternative=Vorgeschlagene Formulierung
ccs_glossaryTerm.alternative.ui.tooltip=Was stattdessen geschrieben werden soll. Wird dem Redakteur im Scanbericht angezeigt.

# The example glossary created when the module is enabled on a site (GlossarySeeder): content, in the site's default language
seed.folder=Compliance-Glossare
seed.glossary=Unzul\u00e4ssige Begriffe
seed.glossary.description=Beispiel, das beim Aktivieren von Content-Governance auf dieser Website angelegt wurde. F\u00fcgen Sie die Begriffe hinzu, die diese Website nicht verwenden darf, und l\u00f6schen Sie den Beispielbegriff, sobald Sie eigene haben.
seed.term=hier klicken
seed.term.reason=Ein Linktext muss sagen, wohin der Link f\u00fchrt: Screenreader-Nutzer gehen die Links einer Seite oft ohne Kontext durch.
seed.term.alternative=das Ziel nennen, zum Beispiel \u201eDen Gesch\u00e4ftsbericht 2026 lesen\u201c

ccs_contentRule=Inhaltsregel
ccs_contentRule.ui.tooltip=Eine Regel, die die Pr\u00fcfungen von Content governance anwenden. Ein Modul legt seine Regeln im Baum der System-Site an, wo ein Administrator sie f\u00fcr alle Sites \u00e4ndert. Eine Site legt eine eigene Regel an.
ccs_contentRule.ruleId=Regel
ccs_contentRule.ruleId.ui.tooltip=Die Kennung der Regel, etwa acme.price, die jeder Befund der Regel zeigt. Nur eine Regel der Site tr\u00e4gt sie.
ccs_contentRule.checkType=Pr\u00fcfungsart
ccs_contentRule.checkType.ui.tooltip=Die Art der Pr\u00fcfung, die die Felder der Regel bestimmt. Muster: eine Schreibregel, ohne Modell. KI: ein Modell pr\u00fcft den Hinweis. Code: eine Messung oder ein Befund des Codes, mit seinen Grenzen.
ccs_contentRule.checkType.PATTERN=Muster
ccs_contentRule.checkType.AI=KI
ccs_contentRule.checkType.CODE=Code
ccs_contentRule.evaluator=Pr\u00fcfung
ccs_contentRule.evaluator.ui.tooltip=Was die Regel pr\u00fcft: pattern, threshold, presence, model oder die Kennung einer Pr\u00fcfung, die ein Modul registriert.
ccs_contentRule.subdomain=Unterbereich
ccs_contentRule.subdomain.ui.tooltip=Die Kennung des Unterbereichs einer Regel au\u00dferhalb des Baums, etwa writing: ihre Befunde erscheinen darin. Leer: der Unterbereich des Anfangs der Kennung, sonst terms f\u00fcr einen Begriff. Eine Regel des Baums nimmt den Unterbereich ihres Elternknotens.
ccs_contentRule.sites=Sites
ccs_contentRule.sites.ui.tooltip=Die Sites, in denen die Regel standardm\u00e4\u00dfig aktiv ist. Standard: alle Sites. Das Layout einer Site hat Vorrang.
ccs_contentRule.enabled=Aktiv
ccs_contentRule.enabled.ui.tooltip=Deaktivieren, um die Regel auszuschalten: Die Pr\u00fcfungen melden dann nichts mehr f\u00fcr sie, auf jeder Site, deren Layout die Regel nicht platziert.
ccs_contentRule.severity=Schweregrad
ccs_contentRule.severity.critical=Kritisch
ccs_contentRule.severity.serious=Schwer
ccs_contentRule.severity.moderate=Mittel
ccs_contentRule.severity.minor=Gering
ccs_contentRule.blocking=Blockierend
ccs_contentRule.blocking.ui.tooltip=Ein Befund einer blockierenden Regel h\u00e4lt die Ver\u00f6ffentlichung des Inhalts an.
ccs_contentRule.fixer=Behoben von
ccs_contentRule.fixer.editor=Redakteur
ccs_contentRule.fixer.developer=Entwickler
ccs_contentRule.fixer.administrator=Administrator
ccs_contentRule.runtime=L\u00e4uft im
ccs_contentRule.runtime.ui.tooltip=Wo die Pr\u00fcfung der Regel l\u00e4uft. Browser: das Content-Governance-Panel f\u00fchrt sie in der Vorschau der Seite aus, und sie stoppt nie eine Ver\u00f6ffentlichung. Leer: der Server.
ccs_contentRule.runtime.server=Server
ccs_contentRule.runtime.browser=Browser
ccs_contentRule.advice=Hinweis
ccs_contentRule.advice.ui.tooltip=Was bei einem Befund zu tun ist, f\u00fcr den Redakteur. Bei einer Regel der Pr\u00fcfungsart KI das Kriterium, das das Modell pr\u00fcft.
ccs_contentRule.title=Titel des Befunds
ccs_contentRule.label=Bezeichnung
ccs_contentRule.source=Importiert aus
ccs_contentRule.retired=Nicht mehr ausgeliefert
ccs_contentRule.retired.ui.tooltip=Gesetzt, wenn das Modul der Regel sie nicht mehr ausliefert. Ein Administrator hat die Regel ge\u00e4ndert, daher bleibt die Regel.
ccsmix_patternCheck=Musterpr\u00fcfung
ccsmix_patternCheck.kind=Art
ccsmix_patternCheck.kind.forbidden=Verbotener Begriff
ccsmix_patternCheck.kind.replace=Zu ersetzender Begriff
ccsmix_patternCheck.kind.mandatory=Pflichtangabe
ccsmix_patternCheck.kind.style=Stilmuster
ccsmix_patternCheck.pattern=Begriff oder Muster
ccsmix_patternCheck.matchMode=Abgleich
ccsmix_patternCheck.matchMode.term=Ganzes Wort oder ganze Wendung, ohne Gro\u00df- und Kleinschreibung und Akzente
ccsmix_patternCheck.matchMode.regex=Regul\u00e4rer Ausdruck
ccsmix_patternCheck.matchMode.ui.tooltip=Ein regul\u00e4rer Ausdruck ignoriert die Gro\u00df- und Kleinschreibung wie ein Begriff. Beginnen Sie ihn mit (?-i), um sie zu beachten.
ccsmix_patternCheck.replacement=Ersatz
ccsmix_patternCheck.ruleLanguage=Sprache (leer: alle)
ccsmix_patternCheck.patternForms=Weitere Formen des Begriffs
ccsmix_patternCheck.replacementForms=Weitere Formen des Ersatzes
ccsmix_patternCheck.patternLanguage=Sprache des Begriffs (Glossar)
ccsmix_patternCheck.wrongExamples=Falsche Beispiele (Texte, die gegen die Regel versto\u00dfen)
ccsmix_patternCheck.rightExamples=Richtige Beispiele (Texte, die die Regel einhalten)
ccsmix_patternCheck.owner=Verantwortlich
ccsmix_patternCheck.decidedOn=Beschlossen am
ccsmix_patternCheck.validFrom=Gilt ab (leer: ohne Beginn)
ccsmix_patternCheck.validUntil=Gilt bis einschlie\u00dflich (leer: ohne Ende)
ccsmix_aiCheck=KI-Pr\u00fcfung
ccsmix_aiCheck.minimum=Mindestpunktzahl
ccsmix_aiCheck.minimum.ui.tooltip=Die kleinste Punktzahl des Modells, die besteht, von 0 bis 100. Leer: die Mindestpunktzahl der Pr\u00fcfung.
ccsmix_codeCheck=Code-Pr\u00fcfung
ccsmix_codeCheck.unit=Einheit
ccsmix_codeCheck.unit.ui.tooltip=Die Einheit von Minimum und Maximum, etwa characters.
ccsmix_codeCheck.minimum=Minimum
ccsmix_codeCheck.minimum.ui.tooltip=Der kleinste zul\u00e4ssige Wert, f\u00fcr die Pr\u00fcfung threshold.
ccsmix_codeCheck.maximum=Maximum
ccsmix_codeCheck.maximum.ui.tooltip=Der gr\u00f6\u00dfte zul\u00e4ssige Wert, f\u00fcr die Pr\u00fcfung threshold.
ccs_contentRuleFolder=Inhaltsregeln
ccs_contentRuleFolder.ui.tooltip=Die Kopien der Regeln eines Moduls vor Version 2.0.0. Das Modul entfernt sie beim Start.
