ccs_contentSubdomain=Unterbereich der Seitenleiste
ccs_contentSubdomain.ui.tooltip=Ein Reiter eines Bereichs, etwa SEO. Er enth\u00e4lt seine Regeln, und jede Regel geh\u00f6rt zu einem Unterbereich.
ccs_contentSubdomain.subdomainId=Unterbereich
