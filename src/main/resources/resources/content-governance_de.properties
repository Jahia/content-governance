ccsmix_complianceContent=Compliance

ccs_glossary=Compliance-Glossar
ccs_glossary.ui.tooltip=Liste der Begriffe, die im Inhalt einer Sprache dieser Website nicht verwendet werden d\u00fcrfen. Der Bereich Compliance des Content-Governance-Panels meldet jede Verwendung.
ccs_glossary.language=Sprache
ccs_glossary.language.ui.tooltip=Sprache der Inhalte, f\u00fcr die dieses Glossar gilt. Legen Sie ein Glossar pro Sprache an oder mehrere f\u00fcr dieselbe Sprache: Der Scan wendet sie alle an.
ccs_glossary.description=Beschreibung
ccs_glossary.description.ui.tooltip=Was dieses Glossar abdeckt und wer es pflegt (zum Beispiel: Rechtsabteilung, Verbraucherrecht). Wird Besuchern nicht angezeigt.

ccs_glossaryTerm=Unzul\u00e4ssiger Begriff
ccs_glossaryTerm.ui.tooltip=Ein Wort oder eine Wendung, die in dieser Sprache nicht verwendet werden darf.
ccs_glossaryTerm.term=Begriff
ccs_glossaryTerm.term.ui.tooltip=Das zu meldende Wort oder die Wendung. Gro\u00df- und Kleinschreibung sowie Akzente werden ignoriert: \u201egratuit\u00e9\u201c findet auch \u201eGratuite\u201c und \u201eGRATUIT\u00c9\u201c.
ccs_glossaryTerm.matchMode=Treffer
ccs_glossaryTerm.matchMode.ui.tooltip=Ganzes Wort: nur das Wort oder die Wendung selbst. Wortanfang: auch W\u00f6rter, die damit beginnen (garant findet garantiert, Garantie). \u00dcberall: auch innerhalb anderer W\u00f6rter.
ccs_glossaryTerm.matchMode.word=Ganzes Wort oder ganze Wendung
ccs_glossaryTerm.matchMode.prefix=Wort beginnt mit
ccs_glossaryTerm.matchMode.anywhere=\u00dcberall, auch innerhalb von W\u00f6rtern
ccs_glossaryTerm.reason=Grund
ccs_glossaryTerm.reason.ui.tooltip=Warum dieser Begriff nicht verwendet werden darf. Wird dem Redakteur im Scanbericht angezeigt.
ccs_glossaryTerm.alternative=Vorgeschlagene Formulierung
ccs_glossaryTerm.alternative.ui.tooltip=Was stattdessen geschrieben werden soll. Wird dem Redakteur im Scanbericht angezeigt.

# The example glossary created when the module is enabled on a site (GlossarySeeder): content, in the site's default language
seed.folder=Compliance-Glossare
seed.glossary=Unzul\u00e4ssige Begriffe
seed.glossary.description=Beispiel, das beim Aktivieren von Content-Governance auf dieser Website angelegt wurde. F\u00fcgen Sie die Begriffe hinzu, die diese Website nicht verwenden darf, und l\u00f6schen Sie den Beispielbegriff, sobald Sie eigene haben.
seed.term=hier klicken
seed.term.reason=Ein Linktext muss sagen, wohin der Link f\u00fchrt: Screenreader-Nutzer gehen die Links einer Seite oft ohne Kontext durch.
seed.term.alternative=das Ziel nennen, zum Beispiel \u201eDen Gesch\u00e4ftsbericht 2026 lesen\u201c
