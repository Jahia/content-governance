ccs_contentDomain.panel=Panel
ccs_contentDomain.panel.ui.tooltip=Das Panel der Seitenleiste, das den Bereich zeigt, etwa governance.
ccs_contentDomain.sites=Sites
ccs_contentDomain.sites.ui.tooltip=Die Sites, in denen er standardm\u00e4\u00dfig aktiv ist. Standard: alle Sites. Das Layout einer Site hat Vorrang.
