efnt_glossaryTerm.status.forbidden=Forbidden translation
efnt_glossaryTerm.source=Imported from

ccs_contentRule=Content rule
ccs_contentRule.ui.tooltip=A rule that the checks of Content governance apply. A module adds its rules to the tree of the system site, where an administrator changes them for every site. A site adds a rule of its own.
ccs_contentRule.ruleId=Rule
ccs_contentRule.ruleId.ui.tooltip=The id of the rule, such as acme.price, which each finding of the rule shows. Only one rule of the site has it.
ccs_contentRule.checkType=Check type
ccs_contentRule.checkType.ui.tooltip=The kind of check, which picks the fields of the rule. Pattern: a writing rule, with no model. AI: a model checks the advice. Code: a measure or a finding of code, with its limits.
ccs_contentRule.checkType.PATTERN=Pattern
ccs_contentRule.checkType.AI=AI
ccs_contentRule.checkType.CODE=Code
ccs_contentRule.evaluator=Check
ccs_contentRule.evaluator.ui.tooltip=What checks the rule: pattern, threshold, presence, model, or the id of a check that a module registers.
ccs_contentRule.subdomain=Subdomain
ccs_contentRule.subdomain.ui.tooltip=The id of the subdomain of a rule outside the tree, such as writing: its findings show in it. Empty: the subdomain of the start of the id, else terms for a term. A rule of the tree takes the subdomain of its parent.
ccs_contentRule.sites=Sites
ccs_contentRule.sites.ui.tooltip=The sites where the rule is on by default. All sites by default. The layout of a site wins.
ccs_contentRule.enabled=On
ccs_contentRule.enabled.ui.tooltip=Clear it to turn the rule off on this site: the checks then report nothing for it.
ccs_contentRule.severity=Severity
ccs_contentRule.severity.critical=Critical
ccs_contentRule.severity.serious=Serious
ccs_contentRule.severity.moderate=Moderate
ccs_contentRule.severity.minor=Minor
ccs_contentRule.blocking=Blocking
ccs_contentRule.blocking.ui.tooltip=A finding of a blocking rule stops the publication of the content.
ccs_contentRule.fixer=Fixed by
ccs_contentRule.fixer.editor=Editor
ccs_contentRule.fixer.developer=Developer
ccs_contentRule.fixer.administrator=Administrator
ccs_contentRule.runtime=Runs in
ccs_contentRule.runtime.ui.tooltip=Where the check of the rule runs. Browser: the Content governance panel runs it on the preview of the page, and it never stops a publication. Empty: the server.
ccs_contentRule.runtime.server=Server
ccs_contentRule.runtime.browser=Browser
ccs_contentRule.advice=Advice
ccs_contentRule.advice.ui.tooltip=What to do about a finding, which the editor reads. For a rule of the check type AI, the criterion that the model checks.
ccs_contentRule.title=Finding title
ccs_contentRule.title.ui.tooltip=The title of a finding, with one line per plural form, such as "one: {{count}} image has no text alternative". Values: {{count}}, {{value}}, {{min}}, {{max}}.
ccs_contentRule.label=Label
ccs_contentRule.label.ui.tooltip=A neutral name of what the rule checks, such as "Title length", shown in a list of passed and failed rules.
ccs_contentRule.source=Imported from
ccs_contentRule.retired=No longer shipped
ccs_contentRule.retired.ui.tooltip=Set when the module of the rule no longer ships it. The site changed the rule, so the rule stays.
ccsmix_patternCheck=Pattern check
ccsmix_patternCheck.kind=Kind
ccsmix_patternCheck.kind.forbidden=Forbidden term
ccsmix_patternCheck.kind.replace=Term to replace
ccsmix_patternCheck.kind.mandatory=Mandatory mention
ccsmix_patternCheck.kind.style=Style pattern
ccsmix_patternCheck.pattern=Term or pattern
ccsmix_patternCheck.matchMode=Match
ccsmix_patternCheck.matchMode.term=Whole word or phrase, any case and accents
ccsmix_patternCheck.pattern.ui.tooltip=A term ending with * also finds the rest of the word: guarant* finds guarantee. A term starting with * also finds the end of another word.
ccsmix_patternCheck.matchMode.regex=Regular expression
ccsmix_patternCheck.matchMode.ui.tooltip=A regular expression ignores case, as a term does. Start it with (?-i) to respect case.
ccsmix_patternCheck.replacement=Replacement
ccsmix_patternCheck.ruleLanguage=Language (empty: all)
ccsmix_patternCheck.patternForms=Other forms of the term
ccsmix_patternCheck.patternForms.ui.tooltip=Other ways to write the term, such as its plural: access tokens.
ccsmix_patternCheck.replacementForms=Other forms of the replacement
ccsmix_patternCheck.replacementForms.ui.tooltip=Other ways to write the replacement, such as its plural: jetons d'acc\u00e8s.
ccsmix_patternCheck.patternLanguage=Language of the term (glossary)
ccsmix_patternCheck.patternLanguage.ui.tooltip=For a glossary term to translate: the language of the term, such as en for "access token" in a rule of fr. Empty: the term is in the language of the rule.
ccsmix_patternCheck.wrongExamples=Wrong examples (texts that break the rule)
ccsmix_patternCheck.rightExamples=Right examples (texts that keep the rule)
ccsmix_patternCheck.owner=Owner
ccsmix_patternCheck.decidedOn=Decided on
ccsmix_patternCheck.validFrom=Applies from (empty: no start)
ccsmix_patternCheck.validUntil=Applies until, this day included (empty: no end)
ccsmix_aiCheck=AI check
ccsmix_aiCheck.minimum=Passing score
ccsmix_aiCheck.minimum.ui.tooltip=The lowest score of the model that passes, from 0 to 100. Empty: the passing score of the check.
ccsmix_codeCheck=Code check
ccsmix_codeCheck.unit=Unit
ccsmix_codeCheck.unit.ui.tooltip=The unit of the minimum and the maximum, such as characters.
ccsmix_codeCheck.minimum=Minimum
ccsmix_codeCheck.minimum.ui.tooltip=The lowest value that passes, for the check threshold.
ccsmix_codeCheck.maximum=Maximum
ccsmix_codeCheck.maximum.ui.tooltip=The highest value that passes, for the check threshold.
ccs_contentRuleFolder=Content rules
ccs_contentRuleFolder.ui.tooltip=The rules that one module adds to this site, one node per rule.
contentGovernanceSites.all=All sites
ccs_contentDomain=Domain of the drawer
ccs_contentDomain.ui.tooltip=A main tab of a panel of the drawer, such as Page quality. Its subdomains are its tabs.
ccs_contentDomain.domainId=Domain
ccs_contentDomain.domainId.ui.tooltip=The id of the domain, such as quality, which its subdomains name.
ccs_contentDomain.panel=Panel
ccs_contentDomain.panel.ui.tooltip=The panel of the drawer that shows the domain, such as governance.
ccs_contentDomain.sites=Sites
ccs_contentDomain.sites.ui.tooltip=The sites where it is on by default. All sites by default. The layout of a site wins.
ccs_contentDomain.label=Label
ccs_contentDomain.label.ui.tooltip=The name of the tab.
ccs_contentDomain.help=Help
ccs_contentDomain.help.ui.tooltip=What the tab checks, for the editor.
ccs_contentDomain.retired=No longer shipped
ccs_contentDomain.retired.ui.tooltip=Set when its module no longer ships it. An administrator changed it, so it stays.
ccs_contentSubdomain=Subdomain of the drawer
ccs_contentSubdomain.ui.tooltip=A tab of a domain, such as SEO. It holds its rules, and each rule belongs to one subdomain.
ccs_contentSubdomain.subdomainId=Subdomain
ccs_contentSubdomain.subdomainId.ui.tooltip=The id of the subdomain, such as seo, which a rule outside the tree names.
ccs_contentSubdomain.sites=Sites
ccs_contentSubdomain.sites.ui.tooltip=The sites where it is on by default. All sites by default. The layout of a site wins.
ccs_contentSubdomain.counts=Counted rules
ccs_contentSubdomain.counts.ui.tooltip=The ids of the rules of other subdomains that it counts, such as the rules of the GEO score.
ccs_contentSubdomain.label=Label
ccs_contentSubdomain.label.ui.tooltip=The name of the tab.
ccs_contentSubdomain.help=Help
ccs_contentSubdomain.help.ui.tooltip=What the tab checks, for the editor.
ccs_contentSubdomain.retired=No longer shipped
ccs_contentSubdomain.retired.ui.tooltip=Set when its module no longer ships it. An administrator changed it, so it stays.
ccs_contentDomainFolder=Domains and subdomains
ccs_contentDomainFolder.ui.tooltip=The domains and the subdomains that one module adds to the drawer, one node each.
