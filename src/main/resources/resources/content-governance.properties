ccs_contentRule=Content rule
ccs_contentRule.ui.tooltip=A rule that the checks of Content governance apply on this site. A module adds its rules; change one on its node, or add a rule of your own.
ccs_contentRule.ruleId=Rule
ccs_contentRule.ruleId.ui.tooltip=The id of the rule, such as acme.price, which each finding of the rule shows. Only one rule of the site has it.
ccs_contentRule.evaluator=Evaluator
ccs_contentRule.evaluator.ui.tooltip=What checks the rule: pattern, threshold, presence, model, or the id of a check that a module registers.
ccs_contentRule.domain=Domain
ccs_contentRule.domain.ui.tooltip=The group of the rule, such as seo. Empty: the part of the id before the first dot.
ccs_contentRule.enabled=On
ccs_contentRule.enabled.ui.tooltip=Clear it to turn the rule off on this site: the checks then report nothing for it.
ccs_contentRule.severity=Severity
ccs_contentRule.severity.critical=Critical
ccs_contentRule.severity.serious=Serious
ccs_contentRule.severity.moderate=Moderate
ccs_contentRule.severity.minor=Minor
ccs_contentRule.blocking=Blocking
ccs_contentRule.blocking.ui.tooltip=A finding of a blocking rule stops the publication of the content.
ccs_contentRule.fixer=Fixed by
ccs_contentRule.fixer.editor=Editor
ccs_contentRule.fixer.developer=Developer
ccs_contentRule.fixer.administrator=Administrator
ccs_contentRule.advice=Advice
ccs_contentRule.advice.ui.tooltip=What to do about a finding, which the editor reads. For the evaluator model, the criterion that the model checks.
ccs_contentRule.unit=Unit
ccs_contentRule.unit.ui.tooltip=The unit of the minimum and the maximum, such as characters.
ccs_contentRule.minimum=Minimum
ccs_contentRule.minimum.ui.tooltip=The lowest value that passes, for the evaluator threshold.
ccs_contentRule.maximum=Maximum
ccs_contentRule.maximum.ui.tooltip=The highest value that passes, for the evaluator threshold.
ccs_contentRule.kind=Kind
ccs_contentRule.kind.forbidden=Forbidden term
ccs_contentRule.kind.replace=Term to replace
ccs_contentRule.kind.mandatory=Mandatory mention
ccs_contentRule.kind.style=Style pattern
ccs_contentRule.pattern=Term or pattern
ccs_contentRule.matchMode=Match
ccs_contentRule.matchMode.term=Whole word or phrase, any case
ccs_contentRule.matchMode.regex=Regular expression
ccs_contentRule.replacement=Replacement
ccs_contentRule.ruleLanguage=Language (empty: all)
ccs_contentRule.wrongExamples=Wrong examples (texts that break the rule)
ccs_contentRule.rightExamples=Right examples (texts that keep the rule)
ccs_contentRule.owner=Owner
