ccsmix_complianceContent=Compliance

ccs_glossary=Compliance glossary
ccs_glossary.ui.tooltip=List of terms that may not be used in the content of one language of this site. The Compliance section of the Content governance drawer reports every use.
ccs_glossary.language=Language
ccs_glossary.language.ui.tooltip=Language of the content this glossary applies to. Create one glossary per language, or several for the same language: the scan applies them all.
ccs_glossary.description=Description
ccs_glossary.description.ui.tooltip=What this glossary covers and who maintains it (for example: legal department, consumer law terms). Not shown to visitors.

ccs_glossaryTerm=Non-authorised term
ccs_glossaryTerm.ui.tooltip=A word or phrase that may not be used in this language.
ccs_glossaryTerm.term=Term
ccs_glossaryTerm.term.ui.tooltip=The word or phrase to report. Case and accents are ignored: "gratuit\u00e9" also finds "Gratuite" and "GRATUIT\u00c9".
ccs_glossaryTerm.matchMode=Match
ccs_glossaryTerm.matchMode.ui.tooltip=Whole word: only the word or phrase itself. Word starting with: also the words that start with it (guarant finds guarantee, guaranteed). Anywhere: also inside other words.
ccs_glossaryTerm.matchMode.word=Whole word or phrase
ccs_glossaryTerm.matchMode.prefix=Word starting with
ccs_glossaryTerm.matchMode.anywhere=Anywhere, inside words too
ccs_glossaryTerm.reason=Reason
ccs_glossaryTerm.reason.ui.tooltip=Why this term may not be used. Shown to the editor in the scan report.
ccs_glossaryTerm.alternative=Suggested wording
ccs_glossaryTerm.alternative.ui.tooltip=What to write instead. Shown to the editor in the scan report.

# The example glossary created when the module is enabled on a site (GlossarySeeder): content, in the site's default language
seed.folder=Compliance glossaries
seed.glossary=Non-authorised terms
seed.glossary.description=Example created when Content Governance was enabled on this site. Add the terms this site must not use, and delete the example term once you have your own.
seed.term=click here
seed.term.reason=Link text must say where the link goes: screen reader users often go through the links of a page out of context.
seed.term.alternative=name the destination, for example "Read the 2026 annual report"
