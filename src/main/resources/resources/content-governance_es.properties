ccs_glossary.ui.tooltip=Lista de t\u00e9rminos que no se pueden usar en el contenido de un idioma de este sitio. La secci\u00f3n Cumplimiento del panel Gobernanza de contenidos se\u00f1ala cada uso.
ccs_glossary.language=Idioma
ccs_glossary.language.ui.tooltip=Idioma del contenido al que se aplica este glosario. Cree un glosario por idioma, o varios para el mismo idioma: el an\u00e1lisis los aplica todos.
ccs_glossary.description=Descripci\u00f3n
ccs_glossary.description.ui.tooltip=Qu\u00e9 cubre este glosario y qui\u00e9n lo mantiene (por ejemplo: departamento jur\u00eddico, t\u00e9rminos de derecho del consumidor). No se muestra a los visitantes.

ccs_glossaryTerm=T\u00e9rmino no autorizado
ccs_glossaryTerm.ui.tooltip=Una palabra o expresi\u00f3n que no se puede usar en este idioma.
ccs_glossaryTerm.term=T\u00e9rmino
ccs_glossaryTerm.term.ui.tooltip=La palabra o expresi\u00f3n que se debe se\u00f1alar. Se ignoran may\u00fasculas y acentos: \u00abgratuit\u00e9\u00bb tambi\u00e9n encuentra \u00abGratuite\u00bb y \u00abGRATUIT\u00c9\u00bb.
ccs_glossaryTerm.matchMode=Coincidencia
ccs_glossaryTerm.matchMode.ui.tooltip=Palabra completa: solo la palabra o expresi\u00f3n. Palabra que empieza por: tambi\u00e9n las palabras que empiezan as\u00ed (garant encuentra garant\u00eda, garantizado). En cualquier parte: tambi\u00e9n dentro de otras palabras.
ccs_glossaryTerm.matchMode.word=Palabra o expresi\u00f3n completa
ccs_glossaryTerm.matchMode.prefix=Palabra que empieza por
ccs_glossaryTerm.matchMode.anywhere=En cualquier parte, tambi\u00e9n dentro de palabras
ccs_glossaryTerm.reason=Motivo
ccs_glossaryTerm.reason.ui.tooltip=Por qu\u00e9 no se puede usar este t\u00e9rmino. Se muestra al editor en el informe del an\u00e1lisis.
ccs_glossaryTerm.alternative=Redacci\u00f3n sugerida
ccs_glossaryTerm.alternative.ui.tooltip=Qu\u00e9 escribir en su lugar. Se muestra al editor en el informe del an\u00e1lisis.

