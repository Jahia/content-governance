ccs_contentRule=Regla de contenido
ccs_contentRule.ui.tooltip=Una regla que los controles de Content governance aplican. Un m\u00f3dulo a\u00f1ade sus reglas al \u00e1rbol del sitio del sistema, donde un administrador las cambia para todos los sitios. Un sitio a\u00f1ade una regla propia.
ccs_contentRule.ruleId=Regla
ccs_contentRule.ruleId.ui.tooltip=El identificador de la regla, como acme.price, que muestra cada hallazgo de la regla. Solo una regla del sitio lo lleva.
ccs_contentRule.checkType=Tipo de control
ccs_contentRule.checkType.ui.tooltip=El tipo de control, que elige los campos de la regla. Patr\u00f3n: una regla de redacci\u00f3n, sin modelo. IA: un modelo controla el consejo. C\u00f3digo: una medida o un hallazgo del c\u00f3digo, con sus l\u00edmites.
ccs_contentRule.checkType.PATTERN=Patr\u00f3n
ccs_contentRule.checkType.AI=IA
ccs_contentRule.checkType.CODE=C\u00f3digo
ccs_contentRule.evaluator=Control
ccs_contentRule.evaluator.ui.tooltip=Lo que controla la regla: pattern, threshold, presence, model o el identificador de un control que registra un m\u00f3dulo.
ccs_contentRule.subdomain=Subdominio
ccs_contentRule.subdomain.ui.tooltip=El identificador del subdominio de una regla fuera del \u00e1rbol, como writing: sus hallazgos aparecen en \u00e9l. Vac\u00edo: el subdominio del inicio del identificador, si no terms para un t\u00e9rmino. Una regla del \u00e1rbol toma el subdominio de su padre.
ccs_contentRule.sites=Sitios
ccs_contentRule.sites.ui.tooltip=Los sitios donde la regla est\u00e1 activa por defecto. Todos los sitios por defecto. La disposici\u00f3n de un sitio prevalece.
ccs_contentRule.enabled=Activa
ccs_contentRule.enabled.ui.tooltip=Desm\u00e1rquela para desactivar la regla: los controles ya no informan nada sobre ella. En una regla del sitio del sistema, la opci\u00f3n vale para cada sitio cuya disposici\u00f3n no coloca la regla.
